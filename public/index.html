<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人工智能文件處理系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      color: #222;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 16px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="text"], input[type="password"], input[type="file"] {
      flex: 1 1 200px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.secondary { background: #4b5563; }
    button.danger { background: #dc2626; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #374151;
    }
    .hidden { display: none; }
    .doc-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .doc-item img {
      width: 140px;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid #ddd;
    }
    .doc-content { flex: 1 1 240px; }
    pre {
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.88rem;
      margin: 6px 0 0;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      button { width: 100%; }
      .doc-item img { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>人工智能文件處理系統 (OCR)</h1>

    <!-- 會員登入／註冊區塊 -->
    <div id="authCard" class="card">
      <h2>會員登入 / 註冊</h2>
      <div class="row">
        <input id="username" type="text" placeholder="帳號（至少 3 字元）" />
        <input id="password" type="password" placeholder="密碼（至少 6 字元）" />
      </div>
      <div class="row" style="margin-top: 10px;">
        <button onclick="login()">登入</button>
        <button class="secondary" onclick="register()">註冊新帳號</button>
      </div>
      <div id="authMsg" class="status"></div>
    </div>

    <!-- 登入後功能區 -->
    <div id="appArea" class="hidden">
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <span>目前登入會員：<strong id="currentUser"></strong></span>
        <button class="danger" onclick="logout()">登出</button>
      </div>

      <!-- 上傳相片區 (POST /documents) -->
      <div class="card">
        <h2>1. 上傳含文字相片並進行 OCR 辨識</h2>
        <div class="row">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
          <button id="uploadBtn" onclick="uploadDocument()">上傳並辨識</button>
        </div>
        <div id="uploadMsg" class="status"></div>
      </div>

      <!-- 搜尋與列表區 (GET /documents & GET /documents?query=...) -->
      <div class="card">
        <h2>2. 搜尋文件文字與相片列表</h2>
        <div class="row">
          <input id="searchInput" type="text" placeholder="輸入關鍵字搜尋相片文字..." />
          <button onclick="searchDocuments()">搜尋</button>
          <button class="secondary" onclick="loadAllDocuments()">顯示全部</button>
        </div>
        <div id="listMsg" class="status"></div>
        <div id="docList"></div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem("token") || "";
    let savedUser = localStorage.getItem("username") || "";

    function updateUI() {
      if (token) {
        document.getElementById("authCard").classList.add("hidden");
        document.getElementById("appArea").classList.remove("hidden");
        document.getElementById("currentUser").textContent = savedUser;
        loadAllDocuments();
      } else {
        document.getElementById("authCard").classList.remove("hidden");
        document.getElementById("appArea").classList.add("hidden");
      }
    }

    async function register() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("authMsg");
      msg.textContent = "註冊中...";

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      msg.textContent = res.ok ? "註冊成功！請點選「登入」按鈕。" : (data.error || "註冊失敗");
    }

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("authMsg");
      msg.textContent = "登入中...";

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        savedUser = data.username;
        localStorage.setItem("token", token);
        localStorage.setItem("username", savedUser);
        msg.textContent = "";
        updateUI();
      } else {
        msg.textContent = data.error || "登入失敗";
      }
    }

    function logout() {
      token = "";
      savedUser = "";
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      updateUI();
    }

    async function uploadDocument() {
      const fileInput = document.getElementById("imageInput");
      const msg = document.getElementById("uploadMsg");
      const btn = document.getElementById("uploadBtn");

      if (!fileInput.files.length) {
        msg.textContent = "請先選擇一張相片！";
        return;
      }

      const formData = new FormData();
      formData.append("image", fileInput.files[0]);

      btn.disabled = true;
      msg.textContent = "正在上傳並執行機器學習 OCR 文字辨識（首次執行需下載語言模型，請稍候）...";

      try {
        const res = await fetch("/documents", {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = "上傳與辨識完成！";
          fileInput.value = "";
          loadAllDocuments();
        } else {
          msg.textContent = data.error || "上傳失敗";
        }
      } catch (err) {
        msg.textContent = "連線發生錯誤";
      } finally {
        btn.disabled = false;
      }
    }

    async function loadAllDocuments() {
      document.getElementById("searchInput").value = "";
      await fetchDocuments("/documents");
    }

    async function searchDocuments() {
      const q = document.getElementById("searchInput").value.trim();
      const url = q ? `/documents?query=${encodeURIComponent(q)}` : "/documents";
      await fetchDocuments(url);
    }

    async function fetchDocuments(url) {
      const listMsg = document.getElementById("listMsg");
      const container = document.getElementById("docList");
      listMsg.textContent = "載入中...";
      container.innerHTML = "";

      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        listMsg.textContent = data.error || "讀取失敗";
        return;
      }

      listMsg.textContent = `共找到 ${data.count} 筆文件`;
      data.documents.forEach((doc) => {
        const item = document.createElement("div");
        item.className = "doc-item";

        const img = document.createElement("img");
        img.src = doc.image_url;
        img.alt = doc.original_name;

        const content = document.createElement("div");
        content.className = "doc-content";

        const title = document.createElement("strong");
        title.textContent = `${doc.original_name}（${doc.created_at}）`;

        const pre = document.createElement("pre");
        pre.textContent = doc.extracted_text || "（未辨識出文字）";

        content.appendChild(title);
        content.appendChild(pre);
        item.appendChild(img);
        item.appendChild(content);
        container.appendChild(item);
      });
    }

    updateUI();
  </script>
</body>
</html>
